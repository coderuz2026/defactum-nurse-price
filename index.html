function tubesFor(item, catName) {
  const n = item.name.toLowerCase(), c = (catName || '').toLowerCase();
  if (/homa/.test(n)) return ['bio', 'serum'];
  if (/свободный т4|free t4/.test(n)) return ['bio']; // в Aurora: Жёлтая крышка (Биохимия) (35), Atelica CI
  if (/гематолог/.test(c)) return ['edta'];
  if (/генетика/.test(c)) return ['gen'];
  if (/коагулограмма/.test(c)) return ['citr'];
  if (/мочи/.test(c)) return ['urine'];
  if (/кала/.test(c)) return ['feces'];
  if (/слюны/.test(c)) return ['saliva'];
  if (/эякулят/.test(c)) return ['sperm'];
  if (/пцр/.test(c)) return ['pcr'];
  if (/бактериолог/.test(c)) return ['bak'];
  if (/микроскоп/.test(c)) return ['glass'];
  if (/чек-ап|прочее/.test(c)) return ['check'];
  if (/биохим|диабет|воспален|микронутриент/.test(c)) return ['bio'];
  return ['serum'];
}

/* ---------- Прайс ---------- */
async function loadPrices(force) {
  const cached = (() => { try { return JSON.parse(localStorage.getItem(LS + '_prices')); } catch (e) { return null; } })();
  if (cached && !force) setPrices(cached);
  for (const url of PRICES_URLS) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.items || !d.items.length) continue;
      const changed = !P.version || P.version !== d.version;
      setPrices(d);
      try { localStorage.setItem(LS + '_prices', JSON.stringify(d)); } catch (e) {}
      if (force) toast((changed ? 'Прайс обновлён: ' : 'Прайс актуален: ') + priceDate());
      render();
      return;
    } catch (e) {}
  }
  if (force) toast(P.version ? 'Нет связи — работаем по сохранённому прайсу' : 'Не удалось загрузить прайс');
  render();
}
// Дата прайса в привычном виде: 2026-11-10 → 10.11.2026
const priceDate = () => String(P.version || '').split('-').reverse().join('.');
function setPrices(d) {
  P.version = d.version; P.cats = d.categories; P.items = d.items; P.byId = {}; P.catById = {};
  d.categories.forEach((c) => { P.catById[c.id] = c; c.n = 0; });
  d.items.forEach((it) => { P.byId[it.id] = it; if (P.catById[it.cat]) P.catById[it.cat].n++; it._s = (it.name + ' ' + (P.catById[it.cat] || {}).name).toLowerCase().replace(/ё/g, 'е'); });
}

/* ---------- Выезд / пациенты ---------- */
const visit = () => S.visits.find((v) => v.id === S.visitId);
function newVisit() {
  const v = { id: uid(), no: String(S.visits.length + 1).padStart(4, '0'), created: Date.now(), addr: '', homeFee: 0, discount: 0, patients: [] };
  S.visits.push(v); S.visitId = v.id; save(); return v;
}
const patient = (id) => (visit() || { patients: [] }).patients.find((p) => p.id === id);
const pItems = (p) => p.items.reduce((s, id) => s + ((P.byId[id] || {}).price || 0), 0);
const pExtra = (p) => (p.extra || []).reduce((s, x) => s + (+x.price || 0), 0);
const pSum = (p) => pItems(p) + pExtra(p);
const fioShort = (p) => (p.last || '') + (p.first ? ' ' + p.first[0].toUpperCase() + '.' : '') + (p.middle ? p.middle[0].toUpperCase() + '.' : '');
function vTotals(v) {
  const an = v.patients.reduce((s, p) => s + pItems(p), 0);
  const ex = v.patients.reduce((s, p) => s + pExtra(p), 0); // услуги не из прайса — без скидки
  const off = Math.round(an * (v.discount || 0) / 100);
  return { an, ex, off, fee: +v.homeFee || 0, total: an - off + ex + (+v.homeFee || 0) };
}
function groupTubes(p) {
  const groups = {};
  p.items.forEach((id) => {
    const it = P.byId[id]; if (!it) return;
    tubesFor(it, (P.catById[it.cat] || {}).name).forEach((k) => { (groups[k] = groups[k] || { key: k, ...TUBES[k], tests: [] }).tests.push(it.name); });
  });
  p.stuck = p.stuck || {};
  if (!p.order) { S.order = (S.order || 900000) + 1; p.order = S.order; save(); } // у пациента с листа p.order = «ID счета» из Aurora
  // Один контейнер у пациента = одна пробирка = один штрихкод: <номер заказа><номер контейнера>
  return Object.values(groups).sort((a, b) => a.no - b.no).map((g) => ({ ...g, code: String(p.order) + String(g.no).padStart(2, '0'), stuck: !!p.stuck[g.key] }));
}

function vCatalog() {
  const p = patient(UI.patientId); if (!p) return vVisit();
  const sel = new Set(p.items);
  const q = UI.q.trim().toLowerCase().replace(/ё/g, 'е');
  let hits = [];
  if (q) {
    const words = q.split(/\s+/);
    const forms = words.map((w) => [w].concat(ALIAS[w] || []));
    const score = (it) => {
      let s = 0;
      for (const fs of forms) {
        let best = -1;
        for (const f of fs) {
          const i = it._s.indexOf(f); if (i < 0) continue;
          const atWord = i === 0 || /[\s(\-,.\/]/.test(it._s[i - 1]);
          best = Math.max(best, (atWord ? 100 : 10) - Math.min(i, 60) / 10);
        }
        if (best < 0) return -1;
        s += best;
      }
      return s;
    };
    hits = P.items.map((it) => [it, score(it)]).filter((x) => x[1] >= 0)
      .sort((a, b) => b[1] - a[1] || a[0].name.length - b[0].name.length).map((x) => x[0]);
  }
  const list = UI.cat ? P.items.filter((it) => it.cat === UI.cat) : P.items.filter((it) => sel.has(it.id));
  const hl = (name) => { if (!q) return esc(name); const w = q.split(/\s+/)[0]; const i = name.toLowerCase().replace(/ё/g, 'е').indexOf(w); return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + w.length)) + '</mark>' + esc(name.slice(i + w.length)); };
  const row = (it) => `<button class="item ${sel.has(it.id) ? 'on' : ''}" data-act="toggle" data-v="${it.id}"><span class="check">${sel.has(it.id) ? I.check() : ''}</span><span class="item-t"><b>${esc(it.name)}</b><span>${esc((P.catById[it.cat] || {}).name || '')}</span></span><span class="price">${fmt(it.price)}</span></button>`;
  return `
  <div class="top">
    <div class="row"><button class="iconbtn" data-act="go" data-v="visit" aria-label="Назад">${I.back}</button>
      <div style="flex:1;min-width:0"><div class="h2" style="font-size:20px">${esc(p.last)} ${esc(p.first)}</div><div class="sub">${P.items.length} услуг в прайсе · выберите анализы</div></div></div>
    <div class="search">
      <label>${I.search}<input id="q" type="text" data-input="q" value="${esc(UI.q)}" placeholder="Поиск: ОАК, ТТГ, витамин D…" autocomplete="off" enterkeyhint="search">${UI.q ? `<button class="del" data-act="clearQ" aria-label="Очистить">${I.x()}</button>` : ''}</label>
      ${q ? `<div class="drop"><div class="drop-h"><b>Подсказки</b><span>найдено ${hits.length}</span></div>
        ${hits.slice(0, 30).map((it) => `<button class="sugg" data-act="toggle" data-v="${it.id}" data-keep="1"><span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;line-height:1.3">${hl(it.name)}</span><span class="sub" style="font-size:12px">${esc((P.catById[it.cat] || {}).name || '')}</span></span><b class="num" style="font-size:14px">${fmt(it.price)}</b><span class="check ${sel.has(it.id) ? 'on' : ''}" style="border-radius:15px;width:30px;height:30px">${sel.has(it.id) ? I.check() : I.plus(BRAND, 14)}</span></button>`).join('')}
        ${!hits.length ? `<div class="empty">Ничего не найдено. Попробуйте короче: «ттг», «витамин», «моча».</div>` : ''}
        ${hits.length > 30 ? `<div class="empty" style="padding:12px">…и ещё ${hits.length - 30}. Уточните запрос.</div>` : ''}
      </div>` : ''}
    </div>
  </div>
  <div class="body" style="padding-bottom:140px">
    <div class="cats">
      <button class="cat ${!UI.cat ? 'on' : ''}" data-act="cat" data-v="0">Выбрано <small>${p.items.length}</small></button>
      ${P.cats.filter((c) => c.n).map((c) => `<button class="cat ${UI.cat === c.id ? 'on' : ''}" data-act="cat" data-v="${c.id}">${esc(c.name)} <small>${c.n}</small></button>`).join('')}
    </div>
    ${!P.items.length ? `<div class="note warn">Прайс загружается… Нужен интернет при первом запуске.</div>` : ''}
    <div class="row between" style="padding:0 4px"><span class="h2">${UI.cat ? esc(P.catById[UI.cat].name) : 'Выбранные анализы'}</span><span class="sub">${list.length}</span></div>
    <div class="list">${list.map(row).join('') || `<div class="empty">Пока ничего не выбрано.<br>Найдите анализ через поиск или выберите категорию выше.</div>`}</div>
  </div>
  <div class="bottom"><div><div class="row between">
    <div><div class="sub">${p.items.length} ${plural(p.items.length, 'анализ', 'анализа', 'анализов')} выбрано</div><b style="font-size:22px;font-weight:800" class="num">${fmt(pSum(p))}</b></div>

/* ---------- События ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (el.tagName === 'A') e.preventDefault();
  const vis = visit();
  switch (a) {
    case 'authMode': UI.authMode = UI.authMode === 'reg' ? 'login' : 'reg'; UI.err = ''; render(); break;
    case 'branch': UI.regBranch = v; keepForm(); break;
    case 'go': go(v); break;
    case 'newPatient': UI.editPatient = null; go('patient'); break;

function formatAddress(d) {
  const a = (d && d.address) || {};

  const parts = [];
  const area = a.city_district || a.suburb || a.borough || '';
  if (street) parts.push(street + (a.house_number ? ', ' + a.house_number : ''));
  else if (a.house_number) parts.push('дом ' + a.house_number);
  if (a.neighbourhood && a.neighbourhood !== street) parts.push(a.neighbourhood);
  if (area) parts.push(area);
  const city = a.city || a.town || a.village || '';
  if (city && !parts.length) parts.push(city);

}

  const done = (msg) => { UI.geoBusy = false; save(); UI._keepScroll = true; if (UI.view === 'visit') render(); if (msg) toast(msg); };

    try { localStorage.removeItem(UPD_KEY); } catch (x) {}
    overlay(`<span style="width:56px;height:56px;border-radius:28px;background:var(--badbg);display:flex;align-items:center;justify-content:center">${WARN_ICON}</span><b style="font-size:18px;color:var(--bad)">Не удалось обновить</b><span class="sub">${esc(e && e.message ? e.message : 'Проверьте интернет и попробуйте ещё раз')}</span><button class="btn" data-act="appUpdate">Повторить</button><button class="btn light small" data-act="scanClose">Закрыть</button>`);
  } finally { try { if (handle && handle.remove) handle.remove(); } catch (e) {} }
}
// После перезапуска сообщаем, получилось ли обновление
function updateResult() {
  let want = null; try { want = localStorage.getItem(UPD_KEY); localStorage.removeItem(UPD_KEY); } catch (e) {}
  if (!want) return;
  if (verNum(APP_VERSION) >= verNum(want)) overlay(`<span style="width:56px;height:56px;border-radius:28px;background:var(--okbg);display:flex;align-items:center;justify-content:center">${I.check('#0F6B3A', 26)}</span><b style="font-size:18px">Успешно обновлено</b><span class="sub">Теперь у вас версия ${APP_VERSION} от ${APP_DATE}</span><button class="btn" data-act="scanClose">Хорошо</button>`);
  else overlay(`<span style="width:56px;height:56px;border-radius:28px;background:var(--badbg);display:flex;align-items:center;justify-content:center">${WARN_ICON}</span><b style="font-size:18px;color:var(--bad)">Обновление не применилось</b><span class="sub">Осталась версия ${APP_VERSION}. Попробуйте ещё раз из профиля.</span><button class="btn light small" data-act="scanClose">Закрыть</button>`);
}

/* ---------- Старт ---------- */
{ const sp = document.getElementById('splash'); if (sp) sp.addEventListener('animationend', (e) => { if (e.animationName === 'spOut') sp.remove(); }); setTimeout(() => { if (sp) sp.remove(); }, 4500); }
S.visits.forEach((v) => { v.homeFee = 0; }); // поле «Выезд на дом» убрано
if (S.me) UI.view = 'visit';
render();
loadPrices(false);
setTimeout(updateResult, document.documentElement.classList.contains('nosplash') ? 300 : 3600);
setTimeout(() => checkUpdate(false), 4000);
setTimeout(() => showInstall(), document.documentElement.classList.contains('nosplash') ? 1200 : 3800); // iPhone: события нет — показываем инструкцию; Android: окно появится по событию или подсказкой
if (IS_APK) { setTimeout(() => { if (S.me) Scan.warmup(); }, 6000); setTimeout(async () => { try { UI.shell = await LP().info(); if (UI.view === 'profile') { UI._keepScroll = true; render(); } } catch (e) {} }, 800); }
else if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => { if (S.me) setTimeout(() => Scan.warmup(), 6000); }).catch(() => {});
