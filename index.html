const shade = (hex, t) => { // t > 0 — светлее, t < 0 — темнее
  const n = hex.replace('#', ''), to = t > 0 ? 255 : 0, k = Math.abs(t);
  return '#' + [0, 2, 4].map((i) => Math.round(parseInt(n.slice(i, i + 2), 16) * (1 - k) + to * k).toString(16).padStart(2, '0')).join('');
};
const ART_KIND = { edta: 'tube', serum: 'gel', bio: 'gel', citr: 'tube', gen: 'tube', check: 'tube', urine: 'cup', feces: 'jar', saliva: 'cup', sperm: 'cup', pcr: 'swab', bak: 'swab', glass: 'slide' };
const ART_FILL = { urine: '#F2CB3A', saliva: '#DCEBF5', sperm: '#EEF0E6', feces: '#8A5A33', pcr: '#F7C6D0', bak: '#F3D98B', check: '#B8C2CC' };

    <linearGradient id="${id}c" x1="0" x2="1"><stop offset="0" stop-color="${capL}"/><stop offset=".35" stop-color="${cap}"/><stop offset="1" stop-color="${capD}"/></linearGradient>
    <linearGradient id="${id}l" x1="0" x2="1"><stop offset="0" stop-color="${liqL}"/><stop offset=".4" stop-color="${liq}"/><stop offset="1" stop-color="${liqD}"/></linearGradient>
    <linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3F7FA"/><stop offset="1" stop-color="#DFE7EE"/></linearGradient>
  </defs>`;
  const ribs = (x0, x1, y0, y1, n) => Array.from({ length: n }, (_, i) => { const x = x0 + (x1 - x0) * (i + 0.5) / n; return `<path d="M${x.toFixed(1)} ${y0}V${y1}" stroke="${capD}" stroke-width="1" opacity=".55"/>`; }).join('');
  const sticker = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#fff" stroke="#D5DEE6" stroke-width=".8"/>` +
    [0.12, 0.22, 0.3, 0.42, 0.5, 0.6, 0.72, 0.8, 0.9].map((k, i) => `<path d="M${(x + w * k).toFixed(1)} ${y + 2.5}V${y + h * 0.58}" stroke="#1F2937" stroke-width="${i % 3 === 0 ? 1.3 : 0.7}"/>`).join('') +

  let body;
  if (kind === 'tube' || kind === 'gel' || kind === 'swab') {
    const glass = 'M12 20V92a12 12 0 0 0 24 0V20Z', top = kind === 'swab' ? 70 : 50;
    body = `<clipPath id="${id}k"><path d="${glass}"/></clipPath>
      <path d="${glass}" fill="url(#${id}g)" stroke="#B9C6D2" stroke-width="1.4"/>

  }
  return `<svg width="48" height="112" viewBox="0 0 48 112" role="img" aria-label="${esc(t.name)}">${defs}${body}</svg>`;
}
function tubesFor(item, catName) {
  const n = item.name.toLowerCase(), c = (catName || '').toLowerCase();
  if (/homa/.test(n)) return ['bio', 'serum'];
  if (/свободный т4|free t4/.test(n)) return ['bio']; // в Aurora: Жёлтая крышка (Биохимия) (35), Atelica CI
  if (/гематолог/.test(c)) return ['edta'];
  if (/генетика/.test(c)) return ['gen'];
  if (/коагулограмма/.test(c)) return ['citr'];
  if (/мочи/.test(c)) return ['urine'];
  if (/кала/.test(c)) return ['feces'];
  if (/слюны/.test(c)) return ['saliva'];
  if (/эякулят/.test(c)) return ['sperm'];
  if (/пцр/.test(c)) return ['pcr'];
  if (/бактериолог/.test(c)) return ['bak'];
  if (/микроскоп/.test(c)) return ['glass'];
  if (/чек-ап|прочее/.test(c)) return ['check'];
  if (/биохим|диабет|воспален|микронутриент/.test(c)) return ['bio'];
  return ['serum'];
}

/* ---------- Прайс ---------- */
async function loadPrices(force) {
  const cached = (() => { try { return JSON.parse(localStorage.getItem(LS + '_prices')); } catch (e) { return null; } })();
  if (cached && !force) setPrices(cached);
  for (const url of PRICES_URLS) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.items || !d.items.length) continue;
      const changed = !P.version || P.version !== d.version;
      setPrices(d);
      try { localStorage.setItem(LS + '_prices', JSON.stringify(d)); } catch (e) {}
      if (force) toast((changed ? 'Прайс обновлён: ' : 'Прайс актуален: ') + priceDate());
      render();
      return;
    } catch (e) {}
  }
  if (force) toast(P.version ? 'Нет связи — работаем по сохранённому прайсу' : 'Не удалось загрузить прайс');
  render();
}
// Дата прайса в привычном виде: 2026-11-10 → 10.11.2026
const priceDate = () => String(P.version || '').split('-').reverse().join('.');
function setPrices(d) {
  P.version = d.version; P.cats = d.categories; P.items = d.items; P.byId = {}; P.catById = {};
  d.categories.forEach((c) => { P.catById[c.id] = c; c.n = 0; });
  d.items.forEach((it) => { P.byId[it.id] = it; if (P.catById[it.cat]) P.catById[it.cat].n++; it._s = (it.name + ' ' + (P.catById[it.cat] || {}).name).toLowerCase().replace(/ё/g, 'е'); });
}

function pMissedIds(p) {
  const m = p.missed || {}, out = new Set(); if (!Object.keys(m).length) return out;
  p.items.forEach((id) => { const it = P.byId[id]; if (it && tubesFor(it, (P.catById[it.cat] || {}).name).some((k) => m[k])) out.add(id); });
  return out;
}
const pItems = (p) => { const miss = pMissedIds(p); return p.items.reduce((s, id) => s + (miss.has(id) ? 0 : ((P.byId[id] || {}).price || 0)), 0); };
const pMiss = (p) => [...pMissedIds(p)].reduce((s, id) => s + ((P.byId[id] || {}).price || 0), 0);
const pExtra = (p) => (p.extra || []).reduce((s, x) => s + (+x.price || 0), 0);
const pSum = (p) => pItems(p) + pExtra(p);
const fioShort = (p) => (p.last || '') + (p.first ? ' ' + p.first[0].toUpperCase() + '.' : '') + (p.middle ? p.middle[0].toUpperCase() + '.' : '');
function vTotals(v) {

  const font = (k) => k === 'logo' ? '600 44px Poppins, ' + F : k === 'total' ? '800 30px ' + F : k === 'head' ? '800 23px ' + F : k === 'sub' ? '600 23px ' + F : k === 'note' ? '400 19px ' + F : '400 22px ' + F;
  const wrap = (txt, max) => { const out = []; let cur = ''; String(txt).split(/\s+/).forEach((w) => { const t = cur ? cur + ' ' + w : w; if (cur && g.measureText(t).width > max) { out.push(cur); cur = w; } else cur = t; }); if (cur) out.push(cur); return out; };

    if (x.k === 'hr') { ops.push({ hr: y + 8 }); y += 22; return; }

    const lines = wrap(x.l, W - 2 * PAD - rw), center = x.k === 'sub' || x.k === 'note';
    lines.forEach((ln, i) => ops.push({ f: font(x.k), t: ln, x: center ? W / 2 : PAD, y: y + (i + 1) * lh - 8, a: center ? 'center' : 'left', c: x.k === 'head' || x.k === 'total' ? '#075E6C' : x.k === 'note' ? '#475569' : '#0F172A' }));

}

// Срок доставки в лабораторию по номеру контейнера, в часах. Заполнить по требованиям лаборатории, например { 4: 2 } — голубая крышка за 2 часа.
const DELIVERY = {};
const MISS_WHY = ['Не нашли вену', 'Пациент отказался', 'Не соблюдена подготовка (не натощак)', 'Не хватило материала'];
const hm = (d) => dt(d).slice(11);

function deliveryInfo(v) {
  let first = null, due = null;
  v.patients.forEach((p) => groupTubes(p).forEach((t) => {
    if (!t.taken || t.missed) return;
    if (!first || t.taken < first.at) first = { at: t.taken, p, t };
    const h = DELIVERY[t.no]; if (h) { const at = t.taken + h * 3600e3; if (!due || at < due.at) due = { at, p, t }; }
  }));
  return { first, due };
}
const tubeTitle = (t) => t.name + (t.no ? ' (' + String(t.no).padStart(2, '0') + ')' : '');

function groupTubes(p) {
  const groups = {};
  p.items.forEach((id) => {
    const it = P.byId[id]; if (!it) return;
    tubesFor(it, (P.catById[it.cat] || {}).name).forEach((k) => { (groups[k] = groups[k] || { key: k, ...TUBES[k], tests: [] }).tests.push(it.name); });
  });
  p.stuck = p.stuck || {};
  if (!p.order) { S.order = (S.order || 900000) + 1; p.order = S.order; save(); } // у пациента с листа p.order = «ID счета» из Aurora
  // Один контейнер у пациента = одна пробирка = один штрихкод: <номер заказа><номер контейнера>
  const tk = p.taken || {}, ms = p.missed || {};
  return Object.values(groups).sort((a, b) => a.no - b.no).map((g) => ({ ...g, code: String(p.order) + String(g.no).padStart(2, '0'), stuck: !!p.stuck[g.key], taken: ms[g.key] ? 0 : (tk[g.key] || 0), missed: ms[g.key] || '' }));
}

        ${tubes.length ? `<div class="chips">${tubes.map((x) => `<span class="chip" style="${x.missed ? 'opacity:.5;text-decoration:line-through' : ''}">${x.taken ? I.check('#0F6B3A', 12) : I.tube(x.cap)}${esc(x.name.replace(/ \((ЭДТА|ПЦР)\)/, ''))}${x.no ? ' (' + String(x.no).padStart(2, '0') + ')' : ''}${x.tests.length > 1 ? ' ×' + x.tests.length : ''}</span>`).join('')}</div>` : ''}

    <button class="btn light small" data-act="history">История выездов и отчёт за смену</button>

function vCatalog() {
  const p = patient(UI.patientId); if (!p) return vVisit();
  const sel = new Set(p.items);
  const q = UI.q.trim().toLowerCase().replace(/ё/g, 'е');
  let hits = [];
  if (q) {
    const words = q.split(/\s+/);
    const forms = words.map((w) => [w].concat(ALIAS[w] || []));
    const score = (it) => {
      let s = 0;
      for (const fs of forms) {
        let best = -1;
        for (const f of fs) {
          const i = it._s.indexOf(f); if (i < 0) continue;
          const atWord = i === 0 || /[\s(\-,.\/]/.test(it._s[i - 1]);
          best = Math.max(best, (atWord ? 100 : 10) - Math.min(i, 60) / 10);
        }
        if (best < 0) return -1;
        s += best;
      }
      return s;
    };
    hits = P.items.map((it) => [it, score(it)]).filter((x) => x[1] >= 0)
      .sort((a, b) => b[1] - a[1] || a[0].name.length - b[0].name.length).map((x) => x[0]);
  }
  const list = UI.cat > 0 ? P.items.filter((it) => it.cat === UI.cat) : P.items.filter((it) => sel.has(it.id));
  const hl = (name) => { if (!q) return esc(name); const w = q.split(/\s+/)[0]; const i = name.toLowerCase().replace(/ё/g, 'е').indexOf(w); return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + w.length)) + '</mark>' + esc(name.slice(i + w.length)); };
  const row = (it) => `<button class="item ${sel.has(it.id) ? 'on' : ''}" data-act="toggle" data-v="${it.id}"><span class="check">${sel.has(it.id) ? I.check() : ''}</span><span class="item-t"><b>${esc(it.name)}</b><span>${esc((P.catById[it.cat] || {}).name || '')}</span>${prepFor(it) ? `<span class="prep">${esc(prepFor(it))}</span>` : ''}</span><span class="price">${fmt(it.price)}</span></button>`;
  const setCard = (x) => { const its = setItems(x), sum = its.reduce((a, it) => a + it.price, 0), have = its.every((it) => sel.has(it.id));
    return `<div class="card pad" style="display:flex;flex-direction:column;gap:8px">
      <div class="row between"><b style="font-size:16px"${x.own ? '' : ''}>${esc(x.name)}</b><b class="num">${fmt(sum)}</b></div>
      <div class="sub" style="line-height:1.45">${its.map((it) => esc(it.name.replace(/ \(.*$/, ''))).join(' · ')}</div>
      <div class="row between"><span class="sub">${its.length} ${plural(its.length, 'анализ', 'анализа', 'анализов')}</span>
        <span class="row">${x.own ? `<button class="linkbtn" data-act="setDel" data-v="${x.key}" style="color:var(--bad)">Удалить</button>` : ''}
        <button class="btn small" style="width:auto;padding:0 16px" data-act="setAdd" data-v="${x.key}" ${have || !its.length ? 'disabled' : ''}>${have ? 'Уже добавлено' : 'Добавить'}</button></span></div></div>`; };
  return `
  <div class="top">
    <div class="row"><button class="iconbtn" data-act="go" data-v="visit" aria-label="Назад">${I.back}</button>
      <div style="flex:1;min-width:0"><div class="h2" style="font-size:20px">${esc(p.last)} ${esc(p.first)}</div><div class="sub">${P.items.length} услуг в прайсе · выберите анализы</div></div></div>
    <div class="search">
      <label>${I.search}<input id="q" type="text" data-input="q" value="${esc(UI.q)}" placeholder="Поиск: ОАК, ТТГ, витамин D…" autocomplete="off" enterkeyhint="search">${UI.q ? `<button class="del" data-act="clearQ" aria-label="Очистить">${I.x()}</button>` : ''}</label>
      ${q ? `<div class="drop"><div class="drop-h"><b>Подсказки</b><span>найдено ${hits.length}</span></div>
        ${hits.slice(0, 30).map((it) => `<button class="sugg" data-act="toggle" data-v="${it.id}" data-keep="1"><span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;line-height:1.3">${hl(it.name)}</span><span class="sub" style="font-size:12px">${esc((P.catById[it.cat] || {}).name || '')}</span></span><b class="num" style="font-size:14px">${fmt(it.price)}</b><span class="check ${sel.has(it.id) ? 'on' : ''}" style="border-radius:15px;width:30px;height:30px">${sel.has(it.id) ? I.check() : I.plus(BRAND, 14)}</span></button>`).join('')}
        ${!hits.length ? `<div class="empty">Ничего не найдено. Попробуйте короче: «ттг», «витамин», «моча».</div>` : ''}
        ${hits.length > 30 ? `<div class="empty" style="padding:12px">…и ещё ${hits.length - 30}. Уточните запрос.</div>` : ''}
      </div>` : ''}
    </div>
  </div>
  <div class="body" style="padding-bottom:140px">
    <div class="cats">
      <button class="cat ${!UI.cat ? 'on' : ''}" data-act="cat" data-v="0">Выбрано <small>${p.items.length}</small></button>
      <button class="cat ${UI.cat === -1 ? 'on' : ''}" data-act="cat" data-v="-1">Наборы <small>${allSets().length}</small></button>
      ${P.cats.filter((c) => c.n).map((c) => `<button class="cat ${UI.cat === c.id ? 'on' : ''}" data-act="cat" data-v="${c.id}">${esc(c.name)} <small>${c.n}</small></button>`).join('')}
    </div>
    ${!P.items.length ? `<div class="note warn">Прайс загружается… Нужен интернет при первом запуске.</div>` : ''}
    ${UI.cat === -1 ? `<div class="row between" style="padding:0 4px"><span class="h2">Наборы анализов</span><span class="sub">${allSets().length}</span></div>
    ${allSets().map(setCard).join('')}
    <div class="note info">Свой набор: отметьте анализы, откройте «Выбрано» и нажмите «Сохранить как набор».</div>` : `
    <div class="row between" style="padding:0 4px"><span class="h2">${UI.cat ? esc(P.catById[UI.cat].name) : 'Выбранные анализы'}</span><span class="sub">${list.length}</span></div>
    <div class="list">${list.map(row).join('') || `<div class="empty">Пока ничего не выбрано.<br>Найдите анализ через поиск или выберите категорию выше.</div>`}</div>
    ${!UI.cat && p.items.length > 1 ? `<button class="btn light small" data-act="setSave">Сохранить как набор</button>` : ''}`}
  </div>
  <div class="bottom"><div><div class="row between">
    <div><div class="sub">${p.items.length} ${plural(p.items.length, 'анализ', 'анализа', 'анализов')} выбрано</div><b style="font-size:22px;font-weight:800" class="num">${fmt(pSum(p))}</b></div>
    <button class="btn" style="width:auto;padding:0 22px" data-act="go" data-v="visit">Готово ${I.check()}</button>
  </div></div></div>`;
}

function labelHtml(p, t, i) {
  return `<div class="label"><img class="lbl" data-p="${esc(p.id)}" data-k="${esc(t.key)}" alt="Этикетка ${esc(t.code)}"></div>`;
}
function vTubes() {
  const p = patient(UI.patientId); if (!p) return vVisit();
  const tubes = groupTubes(p), live = tubes.filter((t) => !t.missed);
  const taken = tubes.filter((t) => t.taken).length, miss = tubes.length - live.length, wait = tubes.length - taken - miss;
  const price = (t) => t.tests.reduce((a, n) => a + ((P.items.find((x) => x.name === n) || {}).price || 0), 0);
  const card = (t) => { const no = !!t.missed, h = DELIVERY[t.no], due = t.taken && h ? t.taken + h * 3600e3 : 0;
    return `<div class="card tube" style="${no ? 'background:#FBFBFC;border-color:#F3D4D4' : t.taken ? 'border-color:#BFE6CD' : ''}">
      <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;${no ? 'opacity:.35;filter:grayscale(1)' : ''}">${tubeArt(t)}</div>
      <div class="tube-t">
        <div><b style="font-size:15px;${no ? 'color:#94A3B8;text-decoration:line-through' : ''}">${esc(tubeTitle(t))}</b><div class="sub">${esc(t.mat)} · ${esc(t.an)}</div></div>
        <div class="chips">${t.tests.length > 1 ? `<span class="tag" style="background:var(--okbg);color:var(--ok)">объединено: ${t.tests.length}</span>` : ''}</div>
        <div style="font-size:13.5px;line-height:1.45;${no ? 'color:#94A3B8;text-decoration:line-through' : ''}">${t.tests.map(esc).join(', ')}</div>
        ${t.taken ? `<div class="note ok" style="padding:8px 11px;align-items:center">${I.check('#0F6B3A', 15)}<span><b>Взято в ${hm(t.taken)}</b>${due ? `<br><span style="color:${due < Date.now() ? 'var(--bad)' : '#7A4B00'}">Доставить в лабораторию до <b>${hm(due)}</b> · ${due < Date.now() ? 'опоздание ' + dur(Date.now() - due) : 'осталось ' + dur(due - Date.now())}</span>` : ''}</span></div>` : ''}
        ${no ? `<div class="note err" style="padding:8px 11px;align-items:center">${I.x('#B42318')}<span><b>Не взято:</b> ${esc(t.missed)}<br>Сумма уменьшена на <b>${fmt(price(t))}</b></span></div>` : ''}
        <div class="row between" style="padding-top:8px;border-top:1px dashed var(--line2);gap:8px">
          ${no ? `<b class="num" style="color:#94A3B8;text-decoration:line-through">${t.code}</b><button class="linkbtn" style="color:var(--brand-deep)" data-act="unmiss" data-v="${t.key}">Вернуть</button>`
          : t.taken ? `<b class="num" style="letter-spacing:1px">${t.code}</b><button class="linkbtn" data-act="untake" data-v="${t.key}">Отменить отметку</button>`
          : `<button class="btn small light" style="flex:1;color:var(--bad);border-color:#F3D4D4" data-act="miss" data-v="${t.key}">Не удалось</button><button class="btn small" style="flex:1.3" data-act="take" data-v="${t.key}">${I.check('#fff', 15)} Взято</button>`}
        </div>
      </div></div>`; };
  return header('Пробирки', `${esc(p.last)} ${esc(p.first)}${p.dob ? ' · ' + esc(p.dob) : ''}`, 'visit') + `
  <div class="body" style="padding-bottom:220px">
    <div class="note info" style="align-items:center"><b style="font-size:22px">${p.items.length}</b>${plural(p.items.length, 'анализ', 'анализа', 'анализов')} → <b style="font-size:22px">${tubes.length}</b>${plural(tubes.length, 'пробирка', 'пробирки', 'пробирок')}<span style="flex:1;text-align:right;font-size:12px">одинаковый контейнер = один штрихкод</span></div>
    ${wait ? `<div class="note info"><span>Отмечайте каждую пробирку: <b>Взято</b> — время забора попадёт на этикетку, <b>Не удалось</b> — анализы уберутся из суммы.</span></div>` : ''}
    ${tubes.map(card).join('')}
    ${live.length ? `<div class="row between" style="padding:0 4px"><span class="h2">Этикетки 40×30 мм</span><span class="sub">листайте →</span></div>
    <div class="labels print-area">${live.map((t, i) => labelHtml(p, t, i)).join('')}</div>` : ''}
    <div class="note warn">Группировка пробирок пока предварительная — по категории анализа. После выгрузки справочника «анализ → контейнер» из Aurora будет 1 в 1 как в лаборатории. Печать на Bluetooth-принтер — в мобильной версии.</div>

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (el.tagName === 'A') e.preventDefault();
  const vis = visit();
  switch (a) {
    case 'authMode': UI.authMode = UI.authMode === 'reg' ? 'login' : 'reg'; UI.err = ''; render(); break;
    case 'branch': UI.regBranch = v; keepForm(); break;
    case 'go': go(v); break;
    case 'newPatient': UI.editPatient = null; go('patient'); break;
    case 'editPatient': UI.editPatient = { ...patient(v) }; go('patient'); break;
    case 'delPatient': { const dp = patient(v); if (dp && ask('Удалить пациента ' + dp.last + ' ' + dp.first + ' и его анализы?')) { vis.patients = vis.patients.filter((p) => p.id !== v); save(); UI._keepScroll = UI.view === 'visit'; go('visit'); toast('Пациент удалён'); } break; }
    case 'sex': { const f = document.querySelector('form[data-submit="patient"]'); UI.editPatient = { ...(UI.editPatient || {}), ...formObj(f), sex: v }; render(); break; }
    case 'catalog': go('catalog', { patientId: v, q: '', cat: 0 }); break;
    case 'tubes': go('tubes', { patientId: v }); break;
    case 'cat': UI.cat = +v; UI._keepScroll = true; render(); break;
    case 'clearQ': UI.q = ''; UI._focus = true; render(); break;
    case 'toggle': {
      const p = patient(UI.patientId); const id = +v; const i = p.items.indexOf(id);
      if (i >= 0) p.items.splice(i, 1); else p.items.push(id);
      save(); if (el.dataset.keep) { UI.q = ''; } UI._keepScroll = true; render(); break;
    }
    case 'take': { const p = patient(UI.patientId); if (!p) break; p.taken = p.taken || {}; p.taken[v] = Date.now(); if (p.missed) delete p.missed[v]; save(); UI._keepScroll = true; render(); break; }
    case 'untake': { const p = patient(UI.patientId); if (p && p.taken) { delete p.taken[v]; save(); UI._keepScroll = true; render(); } break; }
    case 'miss': { const p = patient(UI.patientId), t = p && groupTubes(p).find((x) => x.key === v); if (!t) break; UI._missKey = v;
      overlay(`<b style="font-size:18px">Почему не удалось взять?</b><span class="sub">${esc(tubeTitle(t))}<br>Анализы из этой пробирки уберутся из суммы клиента</span>
        <div style="display:flex;flex-direction:column;gap:8px;width:100%">${MISS_WHY.map((r) => `<button class="btn light small" data-act="missWhy" data-v="${esc(r)}">${esc(r)}</button>`).join('')}<button class="btn light small" data-act="missWhy" data-v="">Другое — написать</button></div>
        <button class="btn light small" data-act="missCancel">Отмена</button>`); break; }
    case 'missWhy': { const p = patient(UI.patientId), key = UI._missKey; if (!p || key == null) break;
      const why = v || (prompt('Причина', '') || '').trim().slice(0, 80); if (!why) break;
      p.missed = p.missed || {}; p.missed[key] = why; if (p.taken) delete p.taken[key]; UI._missKey = null; save(); overlay(''); UI._keepScroll = true; render();
      const off = pMiss(p); if (off) toast('Не взято: сумма уменьшена на ' + fmt(off)); break; }
    case 'missCancel': UI._missKey = null; overlay(''); break;
    case 'unmiss': { const p = patient(UI.patientId); if (p && p.missed) { delete p.missed[v]; save(); UI._keepScroll = true; render(); } break; }
    case 'print': printLabels(patient(UI.patientId)); break;
    case 'shareLabels': shareLabels(patient(UI.patientId)); break;
    case 'prList': printerList(true); break;
    case 'prBt': if (IS_APK) LP().openSettings().catch(() => toast('Откройте настройки Bluetooth вручную')); break;
    case 'prPick': S.printer = Object.assign({ proto: 'tspl', invert: false, gap: 2 }, S.printer || {}, { address: v, name: el.dataset.name }); save(); UI._keepScroll = true; render(); break;
    case 'prProto': S.printer = Object.assign({ invert: false, gap: 2 }, S.printer || {}, { proto: v }); save(); UI._keepScroll = true; render(); break;
    case 'prInvert': S.printer = Object.assign({ proto: 'tspl', gap: 2 }, S.printer || {}, { invert: !(S.printer && S.printer.invert) }); save(); UI._keepScroll = true; render(); break;
    case 'prGap': S.printer = Object.assign({ proto: 'tspl', invert: false }, S.printer || {}, { gap: +v }); save(); UI._keepScroll = true; render(); break;
    case 'prTest': printTest(); break;
    case 'prShift': { const pr = S.printer = Object.assign({ proto: 'tspl', invert: false, gap: 2 }, S.printer || {});
      if (v === 'reset') { pr.dx = 0; pr.dy = 0; } else { const [k, d] = v.split(':'); pr[k] = Math.max(-8, Math.min(8, Math.round(((+pr[k] || 0) + (+d)) * 2) / 2)); }
      save(); UI._keepScroll = true; render(); break; }
    case 'prForget': S.printer = null; save(); render(); break;
    case 'disc': vis.discount = +v; save(); UI._keepScroll = true; render(); break;
    case 'newVisit': if (ask('Завершить текущий выезд и начать новый?')) { closeVisit(vis); newVisit(); go('visit'); } break;
    case 'pay': vis.pay = vis.pay === v ? '' : v; save(); UI._keepScroll = true; render(); break;
    case 'history': go('history', { day: dayKey(Date.now()) }); break;
    case 'dayShift': { const d = new Date((UI.day || dayKey(Date.now())) + 'T12:00:00'); d.setDate(d.getDate() + (+v)); if (dayKey(d) <= dayKey(Date.now())) { UI.day = dayKey(d); render(); } break; }
    case 'dayGo': UI.day = v; render(); break;
    case 'openVisit': if (v !== S.visitId) { closeVisit(vis); S.visitId = v; save(); } go('visit'); break;
    case 'reportShare': { const r = dayReport(UI.day || dayKey(Date.now())); docShare(reportLines(r), 'otchet-' + r.day + '.png', 'Отчёт за смену'); break; }
    case 'reportCopy': copyText(reportText(dayReport(UI.day || dayKey(Date.now())))); break;
    case 'receipt': docShare(receiptLines(vis), 'chek-' + vis.no + '.png', 'Расчёт стоимости услуг'); break;
    case 'setAdd': { const p = patient(UI.patientId), x = allSets().find((q) => q.key === v); if (!p || !x) break; const add = setItems(x).map((it) => it.id).filter((id) => !p.items.includes(id)); p.items.push(...add); save(); UI._keepScroll = true; render(); toast('Добавлено анализов: ' + add.length); break; }
    case 'setDel': { const i = +String(v).slice(1); if (ask('Удалить этот набор?')) { S.sets.splice(i, 1); save(); UI._keepScroll = true; render(); } break; }
    case 'setSave': { const p = patient(UI.patientId); const name = (prompt('Название набора', '') || '').trim().slice(0, 40); if (!p || !name) break; S.sets = S.sets || []; S.sets.push({ name, ids: p.items.slice() }); save(); toast('Набор сохранён'); break; }
    case 'reloadPrices': loadPrices(true); break;
    case 'appCheck': checkUpdate(true); break;
    case 'appUpdate': overlay(''); applyUpdate(); break;
    case 'geo': locate(); break;
    case 'scanCam': overlay(''); document.getElementById('scanCam').click(); break;
    case 'scanClose': overlay(''); break;
    case 'scanPick': document.getElementById('scanPick').click(); break;
    case 'scanDel': scanKeep(); UI.scan.match.items.splice(+v, 1); UI._keepScroll = true; render(); break;
    case 'scanDelExtra': scanKeep(); UI.scan.match.extra.splice(+v, 1); UI._keepScroll = true; render(); break;
    case 'scanSex': scanKeep(); UI.scan.sheet.sex = v; UI._keepScroll = true; render(); break;
    case 'scanText': scanKeep(); UI.scan.showText = !UI.scan.showText; UI._keepScroll = true; render(); break;
    case 'logout': S.me = null; save(); UI.authMode = 'login'; go('auth'); break;
  }
});
function formObj(f) { const o = {}; if (f) new FormData(f).forEach((val, k) => { o[k] = String(val).trim(); }); return o; }
function keepForm() {
  const f = document.querySelector('form'); const vals = formObj(f); render();
  const g = document.querySelector('form'); if (g) Object.entries(vals).forEach(([k, val]) => { const i = g.elements[k]; if (i) i.value = val; });
}
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.mask === 'date') { let d = el.value.replace(/\D/g, '').slice(0, 8); if (d.length > 4) d = d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4); else if (d.length > 2) d = d.slice(0, 2) + '.' + d.slice(2); el.value = d; }
  const k = el.dataset.input; if (!k) return;
  const v = visit();
  if (k === 'q') { UI.q = el.value; UI._focus = true; UI._keepScroll = true; render(); }
  if (k === 'addr') { v.addr = el.value; save(); }
  if (k === 'homeFee') { v.homeFee = +el.value.replace(/\D/g, '') || 0; save(); clearTimeout(UI._t); UI._t = setTimeout(() => { const pos = el.value.length; UI._keepScroll = true; render(); const n = document.querySelector('[data-input="homeFee"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 600); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, o = formObj(f), kind = f.dataset.submit;
  const phone = (o.phone || '').replace(/\D/g, '');
  if (kind === 'register') {
    if (o.name.split(/\s+/).length < 2) return fail('Введите фамилию и имя');
    if (phone.length !== 9) return fail('Телефон: 9 цифр после +998');
    if (!/^\d{4,6}$/.test(o.pin)) return fail('PIN — от 4 до 6 цифр');
    if (o.pin !== o.pin2) return fail('PIN-коды не совпадают');
    if (S.users.some((u) => u.phone === phone)) return fail('Такой телефон уже зарегистрирован — войдите');
    const u = { name: o.name, phone, branch: UI.regBranch || BRANCHES[0], pin: o.pin };
    S.users.push(u); S.me = u; save(); toast('Добро пожаловать, ' + o.name.split(' ')[1] + '!'); go('visit');
  }
  if (kind === 'login') {
    const u = S.users.find((x) => x.phone === phone && x.pin === o.pin);
    if (!u) return fail(S.users.length ? 'Неверный телефон или PIN' : 'На этом телефоне ещё нет аккаунта — нажмите «Регистрация»');
    S.me = u; save(); go('visit');
  }
  if (kind === 'patient') {
    const v = visit(); const base = UI.editPatient || {};
    const p = { ...base, last: o.last, first: o.first, middle: o.middle || '', dob: o.dob, phone: o.phone, sex: base.sex || 'f' };
    if (base.id) { Object.assign(patient(base.id), p); save(); go('visit'); }
    else { p.id = uid(); p.items = []; v.patients.push(p); save(); go('catalog', { patientId: p.id, q: '', cat: 0 }); }
  }
  if (kind === 'scan') {
    scanKeep(); const sh = UI.scan.sheet, m = UI.scan.match, v = visit();
    if (!sh.last || !sh.first) { toast('Заполните фамилию и имя'); return; }
    if (sh.order && !/^\d{5,8}$/.test(sh.order)) { toast('ID счёта — только цифры (5–8)'); return; }
    const dup = sh.order && v.patients.find((x) => String(x.order) === sh.order);
    if (dup && !ask('Пациент с этим ID счёта уже есть в выезде. Заменить его?')) return;
    if (dup) v.patients = v.patients.filter((x) => x !== dup);
    const p = { id: uid(), last: sh.last, first: sh.first, middle: sh.middle, dob: sh.dob, sex: sh.sex || 'f', phone: sh.phone, pid: sh.pid, scanned: true,
      items: m.items.map((x) => x.id), extra: m.extra.filter((x) => x.price > 0).map((x) => ({ name: x.name, price: x.price })) };
    if (sh.order) p.order = Number(sh.order);
    v.patients.push(p);
    if (!v.addr && sh.address) v.addr = sh.address;

function formatAddress(d) {
  const a = (d && d.address) || {};
  const street = a.road || a.pedestrian || a.residential || a.neighbourhood || a.quarter || '';
  const parts = [];
  const area = a.city_district || a.suburb || a.borough || '';
  if (street) parts.push(street + (a.house_number ? ', ' + a.house_number : ''));
  else if (a.house_number) parts.push('дом ' + a.house_number);
  if (a.neighbourhood && a.neighbourhood !== street) parts.push(a.neighbourhood);
  if (area) parts.push(area);
  const city = a.city || a.town || a.village || '';
  if (city && !parts.length) parts.push(city);
  return parts.join(', ') || (d && d.display_name ? d.display_name.split(', ').slice(0, 3).join(', ') : '');
}
function locate() {
  const v = visit(); if (!v || UI.geoBusy) return;
  if (!navigator.geolocation) { toast('Телефон не поддерживает геолокацию'); return; }
  UI.geoBusy = true; UI._keepScroll = true; render();
  const done = (msg) => { UI.geoBusy = false; save(); UI._keepScroll = true; if (UI.view === 'visit') render(); if (msg) toast(msg); };
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    v.geo = { lat, lon, acc: Math.round(pos.coords.accuracy || 0) };
    const coords = lat.toFixed(5) + ', ' + lon.toFixed(5);
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ru&lat=${lat}&lon=${lon}`, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      clearTimeout(t);
      const text = r.ok ? formatAddress(await r.json()) : '';
      v.addr = text || coords;
      done(text ? (v.geo.acc > 100 ? 'Адрес найден, но точность низкая (±' + v.geo.acc + ' м) — проверьте' : 'Адрес определён — проверьте и поправьте при необходимости') : 'Адрес не найден — записал координаты');
    } catch (e) { v.addr = coords; done('Нет интернета — записал координаты'); }
  }, (err) => {
    done(err.code === 1 ? 'Разрешите доступ к геолокации в настройках браузера' : err.code === 3 ? 'Не удалось определить место — выйдите на открытое место и повторите' : 'Геолокация недоступна — включите GPS');
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
