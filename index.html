<style>
:root{
  --brand:#2347C5; --brand-deep:#1B379A; --tint:#EDF1FB; --soft:#BCC8EE;
  --ink:#0F172A; --ink2:#334155; --muted:#475569; --line:#EDF0F4; --line2:#E2E8F0;
  --bg:#F6F7F9; --card:#FFFFFF; --ok:#0F6B3A; --okbg:#ECFDF3; --bad:#B42318; --badbg:#FEF2F2;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,Inter,system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;gap:1px}
.logo-text b{font-weight:800;font-size:16px;letter-spacing:2px}
.logo-text span{font-size:9.5px;font-weight:600;letter-spacing:3px;color:var(--brand-deep)}
.h1{font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin:0}
.h2{font-size:17px;font-weight:800;margin:0}
.sub{font-size:13px;color:var(--muted)}
.body{padding:16px 16px 180px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pad{padding:16px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#F1F5F9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{height:54px;border-radius:16px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 10px 24px rgba(35,71,197,.25)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:#fff;color:var(--brand-deep);border:1.5px solid var(--brand);box-shadow:none}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.small{height:44px;font-size:14px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:13px;font-weight:600;color:var(--ink2)}
.input{height:52px;padding:0 14px;border-radius:15px;border:1.5px solid var(--line2);background:#fff;font-size:16px;font-weight:500;outline:0;width:100%;min-width:0}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
.phone{display:flex;align-items:center;gap:10px;height:52px;border-radius:15px;border:1.5px solid var(--line2);background:#fff;padding:0 14px}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
.phone b{font-weight:600}
.phone i{width:1px;height:24px;background:var(--line2)}
.phone input{flex:1;border:0;outline:0;font-size:16px;font-weight:500;min-width:0;background:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:grid;gap:4px;padding:4px;border-radius:16px;background:#E9EDF2}
.seg button{height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink2);font-weight:500}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(15,23,42,.1);color:var(--ink);font-weight:700}
.opt{min-height:50px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;text-align:left;display:flex;align-items:center;gap:8px;font-weight:500}
.opt.on{border-color:var(--brand);background:var(--tint);font-weight:700}
.dot{width:16px;height:16px;border-radius:8px;border:1.5px solid #94A3B8;flex-shrink:0}
.opt.on .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:15px;font-size:13px;line-height:1.45}
.note.warn{background:#FFF7E6;color:#7A4B00}
.note.info{background:var(--tint);color:var(--brand-deep)}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.err{background:var(--badbg);color:var(--bad)}
.hero{background:var(--tint);border-radius:0 0 36px 36px;padding:calc(48px + env(safe-area-inset-top,0px)) 20px 36px;display:flex;flex-direction:column;align-items:center;gap:16px}
.hero .logo-mark{width:80px;height:80px;border-radius:24px;box-shadow:0 14px 30px rgba(35,71,197,.3)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.bottom>div{pointer-events:auto;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(15,23,42,.07);border-radius:26px 26px 0 0;padding:14px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:10px}
.sum-row{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:1px solid var(--line)}
.total b{font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.chip{height:30px;padding:0 10px 0 6px;border-radius:15px;background:#F6F7F9;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.add{min-height:60px;border-radius:20px;border:1.5px dashed var(--soft);background:var(--tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;width:100%}
.plus{width:28px;height:28px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.search{position:relative}
.search label{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 14px;border-radius:16px;background:#F6F7F9;border:1.5px solid var(--line2)}
.search label:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--tint);background:#fff}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;font-weight:500;min-width:0}
.drop{position:absolute;left:0;right:0;top:60px;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 48px rgba(15,23,42,.18);overflow:hidden;z-index:40;max-height:60vh;overflow-y:auto}
.drop-h{display:flex;justify-content:space-between;padding:12px 16px 6px;font-size:12px;color:var(--muted)}
.drop-h b{font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sugg{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border:0;border-top:1px solid #F1F5F9;background:#fff;text-align:left;min-height:60px}
mark{background:var(--tint);color:var(--brand-deep);font-weight:800;border-radius:4px;padding:0 2px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:#fff;white-space:nowrap;font-weight:500;flex-shrink:0;display:flex;align-items:center;gap:6px}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.cat small{font-size:12px;color:#64748B}
.cat.on small{color:#CBD5E1}
.list{background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid #F1F5F9;background:#fff;text-align:left;min-height:64px}
.item:last-child{border-bottom:0}
.item.on{background:var(--tint)}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid #CBD5E1;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.item.on .check,.sugg .check.on{background:var(--brand);border-color:var(--brand)}
.item-t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.item-t b{font-size:15px;font-weight:600;line-height:1.3}
.item-t span{font-size:12.5px;color:var(--muted)}
.price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.on .price{color:var(--brand-deep);font-weight:800}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.tube{display:flex;gap:14px;padding:14px}
.tube-t{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.tag{height:24px;padding:0 8px;border-radius:8px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center}
.label{width:300px;height:225px;background:#fff;border-radius:6px;box-shadow:0 8px 20px rgba(15,23,42,.14);padding:9px 12px 8px;display:flex;flex-direction:column;font-family:Arimo,Arial,sans-serif;color:#000;flex-shrink:0}
.label svg{width:100%;height:86px;display:block}
.label .code{font-size:20px;font-weight:700;text-align:center;line-height:1.1;letter-spacing:.5px}
.label .l1{font-size:12.5px;line-height:1.25;margin-top:2px}
.label .l2{font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .l3{font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .l4{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels{display:flex;gap:12px;overflow-x:auto;padding:16px;margin:0 -16px;scrollbar-width:none}
.receipt{background:#fff;border-radius:26px;box-shadow:0 20px 50px rgba(35,71,197,.18);overflow:hidden}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 20px;border-bottom:1px solid #F1F5F9}
.meta span{display:block;font-size:11.5px;color:var(--muted)}
.meta b{font-size:14px;font-weight:600}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid #F1F5F9;font-size:15px}
.paybox{margin:12px 14px 14px;padding:16px 18px;border-radius:20px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.paybox b{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.del{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0}
  .label{box-shadow:none;border-radius:0;page-break-after:always;width:40mm;height:30mm;padding:1.2mm 1.6mm}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
const BRAND = '#2347C5';
const PRICES_URLS = ['data/prices.json', 'https://raw.githubusercontent.com/coderuz2026/defactum-nurse-price/main/data/prices.json'];
const BRANCHES = ['De Factum Central', 'Юнусабад', 'Госпитальный', 'De Factum Kids'];
const LS = 'df_nurse_v1';

/* ---------- Пробирки (временное правило по категории, пока нет справочника анализ → контейнер из Aurora) ---------- */
const TUBES = {
  edta:   { no: 1,  name: 'Сиреневая крышка (ЭДТА)',  cap: '#8E5CC9', mat: 'Цельная кровь', an: 'Sysmex XN-1000' },
  serum:  { no: 2,  name: 'Жёлтая крышка',             cap: '#E9B200', mat: 'Сыворотка',     an: 'Immulite-2000' },
  bio:    { no: 35, name: 'Жёлтая крышка (Биохимия)',  cap: '#E9B200', mat: 'Сыворотка',     an: 'Atelica CI, Dimension' },
  citr:   { no: 4,  name: 'Голубая крышка',            cap: '#4BA3E3', mat: 'Плазма цитрат', an: 'Коагулология' },
  urine:  { no: 7,  name: 'Контейнер для мочи',        cap: '#F2C230', mat: 'Моча',          an: 'Mindray EU-5600' },
  feces:  { no: 8,  name: 'Контейнер для кала',        cap: '#8B5A2B', mat: 'Кал',           an: 'Копрология' },
  saliva: { no: 9,  name: 'Контейнер для слюны',       cap: '#94A3B8', mat: 'Слюна',         an: 'Гормоны' },
  sperm:  { no: 49, name: 'Контейнер для эякулята',    cap: '#94A3B8', mat: 'Сперма',        an: 'Спермограмма' },
  pcr:    { no: 6,  name: 'Белая крышка (ПЦР)',        cap: '#E2E8F0', mat: 'Мазок',         an: 'ПЦР' },
  bak:    { no: 21, name: 'Контейнер со средой для б/п', cap: '#22A55B', mat: 'Мазок',       an: 'Бактериология' },
  glass:  { no: 14, name: 'Предметное стекло',         cap: '#CBD5E1', mat: 'Мазок',         an: 'Микроскопия' },
  gen:    { no: 53, name: 'Сиреневая крышка-Ген',      cap: '#8E5CC9', mat: 'Цельная кровь', an: 'Генетика' },
  check:  { no: 0,  name: 'Набор пробирок (уточнить)', cap: '#64748B', mat: 'По составу',    an: 'Чек-ап' }
};
function tubesFor(item, catName) {
  const n = item.name.toLowerCase(), c = (catName || '').toLowerCase();
  if (/homa/.test(n)) return ['bio', 'serum'];
  if (/гематолог/.test(c)) return ['edta'];
  if (/генетика/.test(c)) return ['gen'];
  if (/коагулограмма/.test(c)) return ['citr'];
  if (/мочи/.test(c)) return ['urine'];
  if (/кала/.test(c)) return ['feces'];
  if (/слюны/.test(c)) return ['saliva'];
  if (/эякулят/.test(c)) return ['sperm'];
  if (/пцр/.test(c)) return ['pcr'];
  if (/бактериолог/.test(c)) return ['bak'];
  if (/микроскоп/.test(c)) return ['glass'];
  if (/чек-ап|прочее/.test(c)) return ['check'];
  if (/биохим|диабет|воспален|микронутриент/.test(c)) return ['bio'];
  return ['serum'];
}

/* ---------- Синонимы для поиска (сокращения и узбекский) ---------- */
const ALIAS = {
  'оак': ['общий анализ крови'], 'оам': ['общий анализ мочи', 'анализ мочи'], 'алт': ['аланин'], 'аст': ['аспартат'],
  'ттг': ['тиреотроп'], 'tsh': ['тиреотроп'], 'т4': ['t4'], 'т3': ['t3'], 'вит': ['витамин'], 'д': ['d'], 'витд': ['витамин d'],
  'срб': ['c-реактив', 'с-реактив'], 'crp': ['реактив'], 'хгч': ['хорионическ'], 'пса': ['простат'], 'соэ': ['оседан'],
  'qon': ['кров'], 'siydik': ['моч'], 'gormon': ['гормон'], 'qand': ['глюкоз'], 'najas': ['кал'], 'vitamin': ['витамин'],
  'темир': ['ферритин', 'желез'], 'temir': ['ферритин', 'желез'], 'сахар': ['глюкоз'], 'щитовид': ['щитовид', 'тиреотроп', 't4', 't3']
};

/* ---------- Состояние ---------- */
let S = load() || { users: [], me: null, visits: [], visitId: null, barcode: 90000000 };
let P = { cats: [], items: [], byId: {}, catById: {}, version: null };
let UI = { view: 'auth', authMode: 'login', patientId: null, cat: 0, q: '', err: '', editPatient: null, showDrop: false };

function load() { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' сум';
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return (m10 === 1 && m100 !== 11) ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? b : c; };
const uid = () => Math.random().toString(36).slice(2, 10);
const initials = (s) => s.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
const shortName = (last, first) => (last || '') + (first ? ' ' + first[0].toUpperCase() + '.' : '');
const now = () => new Date();
const dt = (d) => { d = new Date(d); const p = (x) => String(x).padStart(2, '0'); return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- Иконки ---------- */
const I = {
  plus: (c = '#fff', s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  check: (c = '#fff', s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>`,
  search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
  x: (c = '#64748B') => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  trash: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`,
  bars: (c = '#fff') => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M20 5v14"/></svg>`,

/* ---------- Прайс ---------- */
async function loadPrices(force) {
  const cached = (() => { try { return JSON.parse(localStorage.getItem(LS + '_prices')); } catch (e) { return null; } })();
  if (cached && !force) setPrices(cached);
  for (const url of PRICES_URLS) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.items || !d.items.length) continue;
      const changed = !P.version || P.version !== d.version;
      setPrices(d);
      try { localStorage.setItem(LS + '_prices', JSON.stringify(d)); } catch (e) {}
      if (force) toast(changed ? 'Прайс обновлён: ' + d.version : 'Прайс актуален: ' + d.version);
      render();
      return;
    } catch (e) {}
  }
  if (force) toast(P.version ? 'Нет связи — работаем по сохранённому прайсу' : 'Не удалось загрузить прайс');
  render();
}
function setPrices(d) {
  P.version = d.version; P.cats = d.categories; P.items = d.items; P.byId = {}; P.catById = {};
  d.categories.forEach((c) => { P.catById[c.id] = c; c.n = 0; });
  d.items.forEach((it) => { P.byId[it.id] = it; if (P.catById[it.cat]) P.catById[it.cat].n++; it._s = (it.name + ' ' + (P.catById[it.cat] || {}).name).toLowerCase().replace(/ё/g, 'е'); });
}

/* ---------- Выезд / пациенты ---------- */
const visit = () => S.visits.find((v) => v.id === S.visitId);
function newVisit() {
  const v = { id: uid(), no: String(S.visits.length + 1).padStart(4, '0'), created: Date.now(), addr: '', homeFee: 0, discount: 0, patients: [] };
  S.visits.push(v); S.visitId = v.id; save(); return v;
}
const patient = (id) => (visit() || { patients: [] }).patients.find((p) => p.id === id);
const pSum = (p) => p.items.reduce((s, id) => s + ((P.byId[id] || {}).price || 0), 0);
function vTotals(v) {
  const an = v.patients.reduce((s, p) => s + pSum(p), 0);
  const off = Math.round(an * (v.discount || 0) / 100);
  return { an, off, fee: +v.homeFee || 0, total: an - off + (+v.homeFee || 0) };
}
function groupTubes(p) {
  const groups = {};
  p.items.forEach((id) => {
    const it = P.byId[id]; if (!it) return;
    tubesFor(it, (P.catById[it.cat] || {}).name).forEach((k) => { (groups[k] = groups[k] || { key: k, ...TUBES[k], tests: [] }).tests.push(it.name); });
  });
  p.codes = p.codes || {};
  p.stuck = p.stuck || {};
  return Object.values(groups).map((g) => {
    if (!p.codes[g.key]) { S.barcode++; p.codes[g.key] = String(S.barcode); save(); }
    return { ...g, code: p.codes[g.key], stuck: !!p.stuck[g.key] };
  });
}

function vCatalog() {
  const p = patient(UI.patientId); if (!p) return vVisit();
  const sel = new Set(p.items);
  const q = UI.q.trim().toLowerCase().replace(/ё/g, 'е');
  let hits = [];
  if (q) {
    const words = q.split(/\s+/);
    const forms = words.map((w) => [w].concat(ALIAS[w] || []));
    const score = (it) => {
      let s = 0;
      for (const fs of forms) {
        let best = -1;
        for (const f of fs) {
          const i = it._s.indexOf(f); if (i < 0) continue;
          const atWord = i === 0 || /[\s(\-,.\/]/.test(it._s[i - 1]);
          best = Math.max(best, (atWord ? 100 : 10) - Math.min(i, 60) / 10);
        }
        if (best < 0) return -1;
        s += best;
      }
      return s;
    };
    hits = P.items.map((it) => [it, score(it)]).filter((x) => x[1] >= 0)
      .sort((a, b) => b[1] - a[1] || a[0].name.length - b[0].name.length).map((x) => x[0]);
  }
  const list = UI.cat ? P.items.filter((it) => it.cat === UI.cat) : P.items.filter((it) => sel.has(it.id));
  const hl = (name) => { if (!q) return esc(name); const w = q.split(/\s+/)[0]; const i = name.toLowerCase().replace(/ё/g, 'е').indexOf(w); return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + w.length)) + '</mark>' + esc(name.slice(i + w.length)); };

    <div class="search">
      <label>${I.search}<input id="q" type="text" data-input="q" value="${esc(UI.q)}" placeholder="Поиск: ОАК, ТТГ, витамин D…" autocomplete="off" enterkeyhint="search">${UI.q ? `<button class="del" data-act="clearQ" aria-label="Очистить">${I.x()}</button>` : ''}</label>
      ${q ? `<div class="drop"><div class="drop-h"><b>Подсказки</b><span>найдено ${hits.length}</span></div>
        ${hits.slice(0, 30).map((it) => `<button class="sugg" data-act="toggle" data-v="${it.id}" data-keep="1"><span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;line-height:1.3">${hl(it.name)}</span><span class="sub" style="font-size:12px">${esc((P.catById[it.cat] || {}).name || '')}</span></span><b class="num" style="font-size:14px">${fmt(it.price)}</b><span class="check ${sel.has(it.id) ? 'on' : ''}" style="border-radius:15px;width:30px;height:30px">${sel.has(it.id) ? I.check() : I.plus(BRAND, 14)}</span></button>`).join('')}
        ${!hits.length ? `<div class="empty">Ничего не найдено. Попробуйте короче: «ттг», «витамин», «моча».</div>` : ''}
        ${hits.length > 30 ? `<div class="empty" style="padding:12px">…и ещё ${hits.length - 30}. Уточните запрос.</div>` : ''}

    </div>
  </div>

  return header('Пробирки', `${esc(p.last)} ${esc(p.first)}${p.dob ? ' · ' + esc(p.dob) : ''}`, 'visit') + `
  <div class="body" style="padding-bottom:200px">
    <div class="note info" style="align-items:center"><b style="font-size:22px">${p.items.length}</b>${plural(p.items.length, 'анализ', 'анализа', 'анализов')} → <b style="font-size:22px">${tubes.length}</b>${plural(tubes.length, 'пробирка', 'пробирки', 'пробирок')}<span style="flex:1;text-align:right;font-size:12px">одинаковый контейнер = один штрихкод</span></div>
    ${tubes.map((t) => `<div class="card tube">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">${I.bigTube(t.cap, t.mat === 'Моча' ? '#F4D03F' : t.mat === 'Кал' ? '#8B5A2B' : /Мазок|Сперма|Слюна|По составу/.test(t.mat) ? '#E2E8F0' : '#C0392B')}</div>
      <div class="tube-t">
        <div><b style="font-size:15px">${esc(t.name)}${t.no ? ' (' + String(t.no).padStart(2, '0') + ')' : ''}</b><div class="sub">${esc(t.mat)} · ${esc(t.an)}</div></div>
        <div class="chips">${t.tests.length > 1 ? `<span class="tag" style="background:var(--okbg);color:var(--ok)">объединено: ${t.tests.length}</span>` : ''}</div>
        <div style="font-size:13.5px;line-height:1.45">${t.tests.map(esc).join(', ')}</div>
        <div class="row between" style="padding-top:8px;border-top:1px dashed var(--line2)">
          <b class="num" style="letter-spacing:1px">${t.code}</b>
          <button class="btn small ${t.stuck ? '' : 'light'}" style="width:auto;padding:0 12px;height:40px;${t.stuck ? 'background:var(--okbg);color:var(--ok);box-shadow:none' : ''}" data-act="stick" data-v="${t.key}">${t.stuck ? I.check('#0F6B3A') + ' Наклеено' : 'Наклеить'}</button>
        </div>
      </div></div>`).join('')}
    <div class="row between" style="padding:0 4px"><span class="h2">Этикетки 40×30 мм</span><span class="sub">листайте →</span></div>
    <div class="labels print-area">${tubes.map((t, i) => labelHtml(p, t, i)).join('')}</div>
    <div class="note warn">Группировка пробирок пока предварительная — по категории анализа. После выгрузки справочника «анализ → контейнер» из Aurora будет 1 в 1 как в лаборатории. Печать на Bluetooth-принтер — в мобильной версии.</div>
  </div>
  <div class="bottom"><div>
    <div class="row"><span style="flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex"><span style="width:${tubes.length ? Math.round(done / tubes.length * 100) : 0}%;background:#22A55B"></span></span><span class="sub" style="font-weight:600">Наклеено ${done} из ${tubes.length}</span></div>
    <button class="btn" data-act="print">${I.print()} Печать этикеток (${tubes.length})</button>
  </div></div>`;
}
function drawBarcodes() {
  if (!window.JsBarcode) return;
  document.querySelectorAll('svg.bc').forEach((el) => { try { JsBarcode(el, el.dataset.code, { format: 'CODE128', displayValue: false, margin: 0, height: 86, width: 2.4 }); el.setAttribute('preserveAspectRatio', 'none'); } catch (e) {} });
}

function vClient() {
  const v = visit(); const t = vTotals(v); const me = S.me;
  return `
  <div style="background:var(--tint);min-height:100vh;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 24px;display:flex;flex-direction:column;gap:12px">
    <div class="row between" style="padding:0 4px"><span class="sub" style="color:var(--brand-deep);font-weight:600">Экран для клиента</span><button class="iconbtn" style="background:#fff;border-radius:22px" data-act="go" data-v="visit" aria-label="Закрыть">${I.x('#334155')}</button></div>
    <div class="receipt">
      <div style="padding:24px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;border-bottom:1px dashed var(--line2)">
        <div class="logo-mark" style="width:60px;height:60px;border-radius:18px">${I.plus('#fff', 30)}</div>
        <div style="text-align:center"><div style="font-weight:800;font-size:22px;letter-spacing:3px">DE FACTUM</div><div style="font-size:10.5px;font-weight:600;letter-spacing:4px;color:var(--brand-deep)">LABORATORIES</div></div>
        <div style="font-weight:600;color:var(--ink2)">Расчёт стоимости услуг</div>
      </div>
      <div class="meta">
        <div><span>Дата</span><b>${dt(Date.now())}</b></div><div><span>Медсестра</span><b>${esc(me.name)}</b></div>
        <div><span>Филиал</span><b>${esc(me.branch)}</b></div><div><span>Выезд №</span><b>${v.no}</b></div>
      </div>
      <div style="padding:4px 20px">
        ${v.patients.filter((p) => p.items.length).map((p) => `
          ${v.patients.length > 1 ? `<div style="padding:12px 0 2px;font-weight:800;font-size:14px;color:var(--brand-deep)">${esc(p.last)} ${esc(p.first)}</div>` : ''}
          ${p.items.map((id) => P.byId[id]).filter(Boolean).map((it) => `<div class="rline"><span style="line-height:1.35">${esc(it.name)}</span><b class="num" style="font-weight:600">${fmt(it.price).replace(' сум', '')}</b></div>`).join('')}`).join('')}
        ${t.fee ? `<div class="rline"><span>Выезд на дом</span><b class="num" style="font-weight:600">${fmt(t.fee).replace(' сум', '')}</b></div>` : ''}
        ${t.off ? `<div class="rline" style="color:var(--ok)"><span>Скидка ${v.discount}%</span><b class="num">− ${fmt(t.off).replace(' сум', '')}</b></div>` : ''}
      </div>
      <div class="paybox"><span style="font-size:13px;opacity:.85">Итого<br>к оплате</span><b>${fmt(t.total).replace(' сум', '')} <span style="font-size:16px">сум</span></b></div>
    </div>
    <div class="sub" style="text-align:center">Цены действительны на дату расчёта · прайс от ${esc((P.version || '').split('-').reverse().join('.'))}</div>
  </div>`;
}

function vProfile() {
  const me = S.me;
  return header('Профиль', esc(me.branch), 'visit') + `
  <div class="body">
    <div class="card pad row"><span class="avatar" style="width:56px;height:56px;font-size:18px">${esc(initials(me.name))}</span><div><b style="font-size:17px">${esc(me.name)}</b><div class="sub">+998 ${esc(me.phone)} · ${esc(me.branch)}</div></div></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="row between"><span>Версия прайса</span><b>${esc(P.version || '—')}</b></div>
      <div class="row between"><span>Услуг в прайсе</span><b>${P.items.length}</b></div>
      <div class="row between"><span>Выездов на телефоне</span><b>${S.visits.length}</b></div>
      <button class="btn light small" data-act="reloadPrices">${I.sync} Проверить обновление цен</button>
    </div>
    <div class="note info">Чтобы добавить на главный экран: Android — меню ⋮ → «Добавить на главный экран»; iPhone (Safari) — «Поделиться» → «На экран „Домой“».</div>
    <button class="btn light" data-act="logout" style="color:var(--bad)">Выйти</button>
  </div>`;
}

/* ---------- События ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (el.tagName === 'A') e.preventDefault();
  const vis = visit();
  switch (a) {
    case 'authMode': UI.authMode = UI.authMode === 'reg' ? 'login' : 'reg'; UI.err = ''; render(); break;
    case 'branch': UI.regBranch = v; keepForm(); break;
    case 'go': go(v); break;
    case 'newPatient': UI.editPatient = null; go('patient'); break;
    case 'editPatient': UI.editPatient = { ...patient(v) }; go('patient'); break;
    case 'delPatient': if (confirm('Удалить пациента и его анализы?')) { vis.patients = vis.patients.filter((p) => p.id !== v); save(); go('visit'); } break;
    case 'sex': { const f = document.querySelector('form[data-submit="patient"]'); UI.editPatient = { ...(UI.editPatient || {}), ...formObj(f), sex: v }; render(); break; }
    case 'catalog': go('catalog', { patientId: v, q: '', cat: 0 }); break;
    case 'tubes': go('tubes', { patientId: v }); break;
    case 'cat': UI.cat = +v; UI._keepScroll = false; render(); break;
    case 'clearQ': UI.q = ''; UI._focus = true; render(); break;
    case 'toggle': {
      const p = patient(UI.patientId); const id = +v; const i = p.items.indexOf(id);
      if (i >= 0) p.items.splice(i, 1); else p.items.push(id);
      save(); if (el.dataset.keep) { UI.q = ''; } UI._keepScroll = true; render(); break;
    }
    case 'stick': { const p = patient(UI.patientId); p.stuck = p.stuck || {}; p.stuck[v] = !p.stuck[v]; save(); UI._keepScroll = true; render(); break; }
    case 'print': window.print(); break;
    case 'disc': vis.discount = +v; save(); UI._keepScroll = true; render(); break;
    case 'newVisit': if (confirm('Завершить текущий выезд и начать новый?')) { newVisit(); go('visit'); } break;
    case 'reloadPrices': loadPrices(true); break;
    case 'logout': S.me = null; save(); UI.authMode = 'login'; go('auth'); break;
  }
});
function formObj(f) { const o = {}; if (f) new FormData(f).forEach((val, k) => { o[k] = String(val).trim(); }); return o; }
function keepForm() {
  const f = document.querySelector('form'); const vals = formObj(f); render();
  const g = document.querySelector('form'); if (g) Object.entries(vals).forEach(([k, val]) => { const i = g.elements[k]; if (i) i.value = val; });
}
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.mask === 'date') { let d = el.value.replace(/\D/g, '').slice(0, 8); if (d.length > 4) d = d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4); else if (d.length > 2) d = d.slice(0, 2) + '.' + d.slice(2); el.value = d; }
  const k = el.dataset.input; if (!k) return;
  const v = visit();
  if (k === 'q') { UI.q = el.value; UI._focus = true; UI._keepScroll = true; render(); }
  if (k === 'addr') { v.addr = el.value; save(); }
  if (k === 'homeFee') { v.homeFee = +el.value.replace(/\D/g, '') || 0; save(); clearTimeout(UI._t); UI._t = setTimeout(() => { const pos = el.value.length; UI._keepScroll = true; render(); const n = document.querySelector('[data-input="homeFee"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 600); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, o = formObj(f), kind = f.dataset.submit;
  const phone = (o.phone || '').replace(/\D/g, '');
  if (kind === 'register') {
    if (o.name.split(/\s+/).length < 2) return fail('Введите фамилию и имя');
    if (phone.length !== 9) return fail('Телефон: 9 цифр после +998');
    if (!/^\d{4,6}$/.test(o.pin)) return fail('PIN — от 4 до 6 цифр');
    if (o.pin !== o.pin2) return fail('PIN-коды не совпадают');
    if (S.users.some((u) => u.phone === phone)) return fail('Такой телефон уже зарегистрирован — войдите');
    const u = { name: o.name, phone, branch: UI.regBranch || BRANCHES[0], pin: o.pin };
    S.users.push(u); S.me = u; save(); toast('Добро пожаловать, ' + o.name.split(' ')[1] + '!'); go('visit');
  }
  if (kind === 'login') {
    const u = S.users.find((x) => x.phone === phone && x.pin === o.pin);
    if (!u) return fail(S.users.length ? 'Неверный телефон или PIN' : 'На этом телефоне ещё нет аккаунта — нажмите «Регистрация»');
    S.me = u; save(); go('visit');
  }
  if (kind === 'patient') {
    const v = visit(); const base = UI.editPatient || {};
    const p = { ...base, last: o.last, first: o.first, dob: o.dob, phone: o.phone, sex: base.sex || 'f' };
    if (base.id) { Object.assign(patient(base.id), p); save(); go('visit'); }
    else { p.id = uid(); p.items = []; v.patients.push(p); save(); go('catalog', { patientId: p.id, q: '', cat: 0 }); }
  }
  function fail(m) { UI.err = m; keepForm(); }
});

/* ---------- Старт ---------- */
if (S.me) UI.view = 'visit';
render();
loadPrices(false);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
