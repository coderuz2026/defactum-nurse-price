name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Версия приложения
        id: ver
        run: |
          VER=$(grep -o "APP_VERSION = '[0-9.]*'" index.html | grep -o "[0-9.]*" | head -1)
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "Версия $VER, сборка ${{ github.run_number }}"

      - name: Проверка расчётов
        run: node tools/calc_test.js | tail -3

      - name: Веб-часть
        run: |
          mkdir -p www
          cp -r index.html scan.js manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png data vendor www/
          # Android при упаковке APK сам распаковывает .gz — делаем это заранее, чтобы APK и архив обновления были одинаковыми
          gunzip www/vendor/tesseract/lang/*.gz
          ls -la www/vendor/tesseract/lang
          # архив веб-части для обновления «по воздуху»
          (cd www && zip -qr ../defactum-nurse-web.zip .)
          ls -la defactum-nurse-web.zip

      - name: Проект Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          # разрешение на геолокацию (кнопка «адрес выезда»)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          # Bluetooth для печати этикеток
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -c BLUETOOTH_CONNECT android/app/src/main/AndroidManifest.xml
          # наш модуль печати (Java)
          JAVA_DIR=android/app/src/main/java/uz/defactum/nurse
          ls $JAVA_DIR
          cp apk/java/*.java $JAVA_DIR/
          grep -n "cache-path" android/app/src/main/res/xml/file_paths.xml
          # фирменная иконка
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r apk/res/* android/app/src/main/res/
          # номер версии
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > android/app/nurse.keystore || { echo "::error::Секрет KEYSTORE_B64 повреждён: это не base64"; exit 1; }
            KEYFP=$(keytool -list -v -keystore android/app/nurse.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')
            if [ -z "$KEYFP" ]; then echo "::error::Секрет KEYSTORE_B64 повреждён: ключ не читается. Вставьте содержимое файла KEYSTORE_B64.txt целиком."; exit 1; fi
            echo "Ключ из секрета, отпечаток: $KEYFP"
            echo "KEYFP=$KEYFP" >> "$GITHUB_ENV"
            echo "SIGN=постоянный ключ" >> "$GITHUB_ENV"
            # подпись задаём явно, не полагаясь на папку по умолчанию
            printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("nurse.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> android/app/build.gradle
            tail -12 android/app/build.gradle
          else
            echo "SIGN=ВРЕМЕННЫЙ ключ (секрет KEYSTORE_B64 не задан)" >> "$GITHUB_ENV"
            echo "::warning::Секрет KEYSTORE_B64 не задан — APK подписан временным ключом. Следующую сборку нельзя будет установить поверх этой."
          fi

      - name: Сборка
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../defactum-nurse.apk
          ls -la ../defactum-nurse.apk
          FP=$(keytool -printcert -jarfile ../defactum-nurse.apk | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          echo "Отпечаток подписи APK: $FP"
          echo "FP=$FP" >> "$GITHUB_ENV"
          if [ -n "$KEYFP" ] && [ "$FP" != "$KEYFP" ]; then echo "::error::APK подписан не тем ключом: $FP вместо $KEYFP"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: defactum-nurse-apk
          path: defactum-nurse.apk

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}-b${{ github.run_number }}"
          printf 'APK для Android. Скачайте файл defactum-nurse.apk и установите.\n\nПодпись: %s\nОтпечаток SHA-256: %s\n' "$SIGN" "$FP" > notes.md
          gh release create "$TAG" defactum-nurse.apk defactum-nurse-web.zip --latest --title "de factum ${{ steps.ver.outputs.name }} (сборка ${{ github.run_number }})" --notes-file notes.md
